# ============================================================
#  LeafCraftPRO — Cloudflare Pages project configuration.
#
#  Used by the Wrangler CLI:
#      npx wrangler pages deploy dist
#
#  With `pages_build_output_dir` set, Wrangler knows which folder
#  to upload, so no extra arguments are needed. If you instead
#  connect the repository in the Cloudflare dashboard, Wrangler
#  reads this file for the build settings.
#
#  This project is a static export: there is no Worker, no
#  Functions directory and no runtime. Every page is pre-rendered
#  into dist/ by `npm run build`.
# ============================================================

name = "leafcraftpro"

# The folder uploaded to Cloudflare. Produced by `npm run build`.
pages_build_output_dir = "dist"

# Pinned so Cloudflare's build image uses a consistent Node runtime.
compatibility_date = "2024-09-23"

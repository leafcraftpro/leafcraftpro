<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LeafCraftPRO">
  <title>LeafCraftPRO</title>
  <defs>
    <linearGradient id="lcTile" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#33935A"/>
      <stop offset="0.5" stop-color="#1C5638"/>
      <stop offset="1" stop-color="#6BA83E"/>
    </linearGradient>
    <radialGradient id="lcGloss" cx="0.26" cy="0.14" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lcEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="lcTileClip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#lcTileClip)">
    <rect width="512" height="512" fill="url(#lcTile)"/>
    <rect width="512" height="512" fill="url(#lcGloss)"/>
    <rect x="4" y="4" width="504" height="504" rx="113"
          fill="none" stroke="url(#lcEdge)" stroke-width="8"/>
  </g>

  <!-- The mark: a leaf with a gently bowed rib and three staggered,
       upward-sweeping vein pairs. The veins stop short of the rib so
       the join reads as an over-under weave without becoming noise. -->
  <g transform="translate(76 66.25) scale(15)"
     fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="1.5"
          d="M12 2.3 C 17.4 5.6 20.4 9.6 20.4 14.2 C 20.4 18.4 17 21.2 12 23 C 7 21.2 3.6 18.4 3.6 14.2 C 3.6 9.6 6.6 5.6 12 2.3 Z"/>
    <path stroke-width="1.3" d="M12 5.4 C 12.1 10.2 12.1 16.4 12 22.1"/>
    <path stroke-width="1.1" d="M12.6 10.2 L 17.2 8.7"/>
    <path stroke-width="1.1" d="M12.6 13.6 L 18 11.9"/>
    <path stroke-width="1.1" d="M12.6 17 L 16.8 15.6"/>
    <path stroke-width="1.1" d="M11.4 11.1 L 6.8 9.6"/>
    <path stroke-width="1.1" d="M11.4 14.5 L 6 12.8"/>
    <path stroke-width="1.1" d="M11.4 17.9 L 7.4 16.5"/>
  </g>
</svg>
